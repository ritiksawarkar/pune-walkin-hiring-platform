spring.application.name=pune-walkin-platform-backend-test

# In-Memory H2 Database for Automated Tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Schema
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Flyway disabled for in-memory mock tests
spring.flyway.enabled=false

# JWT & Security Test Settings
app.jwt.secret=4c92a94f6f890b5a3712b3e8c973a25b18f04e76a1d8c2e9b05f3a74c6d81e92
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=*
app.upload.dir=./target/test-uploads

# Email Test Settings
app.mail.enabled=false
app.mail.from=test-noreply@punewalkin.com
spring.mail.host=localhost
spring.mail.port=587
